services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mrti_tickets
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    expose:
      - '3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      - PORT=4000
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root
      - DATABASE_NAME=mrti_tickets
      - CORE_API_URL=http://host.docker.internal:8477
      - MRTI_INFRA_API_URL=http://host.docker.internal:3002
      - MRTI_ACTIVOS_API_URL=http://host.docker.internal:3003
      - AUTH_PROFILE_URL=http://host.docker.internal:3005/api/auth/me
      - AUTH_TICKET_CONTEXT_URL=http://host.docker.internal:3005/api/auth/ticket-context
      - AUTH_ASSIGNEES_URL=http://host.docker.internal:3005/api/auth/assignees
      - AGENT_API_KEY=ff8a81dea344cd3887e1897fd1d4cca3ac08e80b61de048a141e2f8dcaa9eb21
      - CORE_NOTIFICATION_URL=http://host.docker.internal:3002/api/notifications
      # Llamadas de servicio hacia Activos/Infra sin usuario navegando (Fase 1
      # de la integración de plataforma) -- mismo valor que INTERNAL_SERVICE_KEY
      # en los .env de MRTI-Activos y MRTI-Infra.
      - INTERNAL_SERVICE_KEY=b98a9c2174252bcdeba70b0902a08b81725f0428000923b7d0e1088c8c387ad3
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - attachments_data:/app/storage/attachments

  frontend:
    build:
      context: ./frontend
    ports:
      - '127.0.0.1:4173:4173'
    depends_on:
      - backend

volumes:
  db_data:
  attachments_data:
