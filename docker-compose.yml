services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mrti_tickets
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    expose:
      - '3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      - PORT=4000
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root
      - DATABASE_NAME=mrti_tickets
      - CORE_API_URL=http://host.docker.internal:8477
      - IT_MANAGEMENT_API_URL=http://host.docker.internal:3002
      - AUTH_PROFILE_URL=http://host.docker.internal:3002/api/auth/me
      - AUTH_TICKET_CONTEXT_URL=http://host.docker.internal:3002/api/auth/ticket-context
      - AUTH_ASSIGNEES_URL=http://host.docker.internal:3002/api/auth/assignees
      - AGENT_API_KEY=changeme
      - CORE_NOTIFICATION_URL=http://host.docker.internal:3002/api/notifications
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - attachments_data:/app/storage/attachments

  frontend:
    build:
      context: ./frontend
    ports:
      - '127.0.0.1:4173:4173'
    depends_on:
      - backend

volumes:
  db_data:
  attachments_data:
