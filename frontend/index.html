<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="200x200" href="/mrti-logo.png?v=20261013" />
    <meta name="description" content="Mesa de servicio MRTI — gestión de tickets, SLA y base de conocimiento." />
    <meta name="theme-color" content="#211a11" />
    <link rel="preload" href="/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/big-shoulders-display-800.woff2" as="font" type="font/woff2" crossorigin />
    <title>MRTI Tickets</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mrti_theme');
          if (stored === 'light' || stored === 'dark') document.documentElement.setAttribute('data-theme', stored);
        } catch (error) { /* localStorage no disponible */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
