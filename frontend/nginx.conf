server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /tickets { return 301 /tickets/; }
  location /tickets/ {
    rewrite ^/tickets/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html =404;
  }
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
